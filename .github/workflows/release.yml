name: Release Build

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: ridgeback

jobs:
  # ---------------------------------------------------------------------------
  # Extract version from build_constants.toml (single source of truth)
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from build_constants.toml
        id: version
        run: |
          MAJOR=$(grep '^major' build_constants.toml | head -1 | sed 's/[^0-9]//g')
          MINOR=$(grep '^minor' build_constants.toml | head -1 | sed 's/[^0-9]//g')
          PATCH=$(grep '^patch' build_constants.toml | head -1 | sed 's/[^0-9]//g')
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version from build_constants.toml: $VERSION"

  # ---------------------------------------------------------------------------
  # Build matrix — Windows, Linux, macOS (x86-64 + Apple Silicon)
  # ---------------------------------------------------------------------------
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ridgeback-linux-x86_64
            archive_ext: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ridgeback-windows-x86_64
            archive_ext: zip

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ridgeback-macos-x86_64
            archive_ext: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ridgeback-macos-aarch64
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Linux system deps (eframe / egui / wgpu / GTK file dialogs) ──
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgtk-3-dev libglib2.0-dev \
            libatk1.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libvulkan-dev libssl-dev pkg-config

      # ── Rust toolchain ──
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ── Build ──
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package (Unix) ──
      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} staging/
          cp -r assets staging/
          cp README.md LICENSE staging/
          cd staging
          tar czf ../${{ matrix.artifact }}.tar.gz .

      # ── Package (Windows) ──
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe" staging\
          Copy-Item -Recurse assets staging\
          Copy-Item README.md, LICENSE staging\
          Compress-Archive -Path staging\* -DestinationPath "${{ matrix.artifact }}.zip"

      # ── Upload ──
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive_ext }}
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Create GitHub Release with auto-generated notes
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for release-note generation

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Ridgeback v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          append_body: true
          body: |
            ## Ridgeback Terminal — v${{ needs.prepare.outputs.version }}

            ### Downloads

            | Platform | Architecture | File |
            |---|---|---|
            | 🐧 Linux | x86_64 | `ridgeback-linux-x86_64.tar.gz` |
            | 🪟 Windows | x86_64 | `ridgeback-windows-x86_64.zip` |
            | 🍎 macOS | x86_64 (Intel) | `ridgeback-macos-x86_64.tar.gz` |
            | 🍎 macOS | aarch64 (Apple Silicon) | `ridgeback-macos-aarch64.tar.gz` |

            ### Installation

            Download the archive for your platform, extract it, and run the `ridgeback` binary.
            Assets (shaders, plugins, images) are bundled in the `assets/` directory alongside the binary.
            
            Please note that Ridgeback is not yet available on package managers like Homebrew or APT, so manual installation is required for now.
            
            Also it is in very early stages of development, so expect many rough edges and missing features. 
            Feedback is very welcome!
            Please submit issues and feature requests on the GitHub repository:
            https://github.com/quaternioninterpolation/Ridgeback-Terminal
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

