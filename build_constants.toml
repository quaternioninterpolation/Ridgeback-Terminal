# ──────────────────────────────────────────────────────────────
# Ridgeback Build Constants
# ──────────────────────────────────────────────────────────────
# This file is the **single source of truth** for the application
# version. It is consumed by:
#   • crates/ridgeback-app/build.rs   → sets RIDGEBACK_VERSION env
#   • scripts/bundle-macos.sh         → macOS .app bundle version
#   • scripts/sync-version.sh         → syncs Cargo.toml workspace version
#   • .github/workflows/release.yml   → tags & names the release
#
# To release a new version:
#   1. Bump the version here
#   2. Ensure all changes are described in the changelog (CHANGELOG.md)
#   3. Run: ./scripts/sync-version.sh
#   4. See docs/releasing.md for full instructions
# ──────────────────────────────────────────────────────────────

[version]
major = 0
minor = 1
patch = 5
