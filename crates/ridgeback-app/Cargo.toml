[package]
name = "ridgeback-app"
version.workspace = true
edition = "2021"

[[bin]]
name = "ridgeback"
path = "src/main.rs"

[dependencies]
ridgeback-config = { workspace = true }
ridgeback-core = { workspace = true }
ridgeback-plugin = { workspace = true }
ridgeback-gpu = { workspace = true }
ridgeback-ai = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
eframe = "0.29"
egui = "0.29"
egui-wgpu = "0.29"
wgpu = "23"
fontdue = "0.9"
rfd = "0.15"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
egui-phosphor = "0.7"
serde_json = { workspace = true }

# Enable Metal GPU acceleration for local AI on macOS
[target.'cfg(target_os = "macos")'.dependencies]
ridgeback-ai = { path = "../ridgeback-ai", features = ["metal"] }

# Windows registry access for context-menu and file-association registration
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[build-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
